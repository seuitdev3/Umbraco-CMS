pool:
  vmImage: 'windows-latest'

variables:
  SolutionName: $(SOLUTION_NAME)
  BuildPlatform: 'Any CPU'
  BuildConfiguration: 'Release'
  EnvironmentName: Production

steps:
- task: DotNetCoreCLI@2
  inputs:
    projects: '$(SolutionName)'
    command: 'build'
    arguments: '/nologo /nr:false /p:DeployOnBuild=true /p:DeployDefaultTarget=WebPublish /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:DeleteExistingFiles=True /p:SkipInvalidConfigurations=true /p:IncludeSetAclProviderOnDestination=False /p:AutoParameterizationWebConfigConnectionStrings=False /p:platform="$(BuildPlatform)" /p:configuration="$(BuildConfiguration)" /p:PackageLocation="../_build" /p:EnvironmentName=$(EnvironmentName)'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'